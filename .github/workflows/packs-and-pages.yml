name: Packs and Pages

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate & Validate Word Packs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Generate daily word packs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-packs.mjs

      - name: Validate word packs
        run: node scripts/validate-packs.mjs

      - name: Commit updated packs
        run: |
          if [[ -n "$(git status --porcelain packs/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packs/
            git commit -m "chore(packs): refresh daily word packs [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "No word pack changes to commit."
          fi

  build-and-deploy:
    name: Build & Deploy GitHub Pages
    needs: generate
    if: ${{ always() && (needs.generate.result == 'success' || needs.generate.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pack rules unit tests and validate packs
        run: |
          npm test
          npm run packs:validate

      - name: Build static web app with repository base path
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY%%/*}"
          if [[ "$REPO_NAME" == "${OWNER_NAME}.github.io" ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${REPO_NAME}/"
          fi
          echo "Building TypeVerse web app with VITE_BASE=${BASE_PATH}"
          VITE_BASE="$BASE_PATH" npm run build:web
          cp dist/index.html dist/404.html
          npm run check:secrets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
