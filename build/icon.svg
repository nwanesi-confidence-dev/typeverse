<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <linearGradient id="tvBg" x1="64" y1="64" x2="960" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#080B14" />
      <stop offset="100%" stop-color="#04070D" />
    </linearGradient>
    <linearGradient id="tvChassis" x1="160" y1="220" x2="864" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16223D" />
      <stop offset="100%" stop-color="#0C1324" />
    </linearGradient>
    <linearGradient id="tvAccent" x1="220" y1="260" x2="800" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="tvRing" x1="200" y1="160" x2="824" y2="864" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.18" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#tvBg)" />
  <rect x="44" y="44" width="936" height="936" rx="210" stroke="url(#tvRing)" stroke-width="6" />

  <!-- Mechanical Keyboard Frame -->
  <rect x="148" y="232" width="728" height="560" rx="76" fill="url(#tvChassis)" stroke="#243559" stroke-width="14" />

  <!-- Top Row Keys -->
  <rect x="212" y="298" width="128" height="114" rx="24" fill="#1E2D4D" stroke="#2D4270" stroke-width="4" />
  <rect x="364" y="298" width="128" height="114" rx="24" fill="#1E2D4D" stroke="#2D4270" stroke-width="4" />
  <rect x="516" y="298" width="128" height="114" rx="24" fill="#1E2D4D" stroke="#2D4270" stroke-width="4" />
  <rect x="668" y="298" width="144" height="114" rx="24" fill="url(#tvAccent)" />

  <!-- Home Row Keys -->
  <rect x="242" y="442" width="128" height="114" rx="24" fill="#1E2D4D" stroke="#2D4270" stroke-width="4" />
  <rect x="394" y="442" width="128" height="114" rx="24" fill="url(#tvAccent)" />
  <rect x="546" y="442" width="128" height="114" rx="24" fill="#1E2D4D" stroke="#2D4270" stroke-width="4" />
  <rect x="698" y="442" width="114" height="114" rx="24" fill="#1E2D4D" stroke="#2D4270" stroke-width="4" />

  <!-- Subtle Home-Row Homing Bar on Highlighted Key -->
  <rect x="434" y="528" width="48" height="8" rx="4" fill="#04131B" opacity="0.7" />

  <!-- Spacebar + Speed Accent -->
  <rect x="272" y="592" width="480" height="94" rx="26" fill="#182542" stroke="#22D3EE" stroke-width="8" />
  <rect x="424" y="634" width="176" height="10" rx="5" fill="url(#tvAccent)" />
</svg>
